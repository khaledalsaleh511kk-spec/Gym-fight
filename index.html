DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحذير ⚠️</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.box {
  width: 90%;
  max-width: 500px;
  background: #151515;
  padding: 30px 20px;
  border-radius: 20px;
}

h1 {
  color: #ff3333;
}

.progress {
  height: 20px;
  background: #333;
  border-radius: 20px;
  overflow: hidden;
  margin: 25px 0 10px;
}

#bar {
  height: 100%;
  width: 0%;
  background: #ff3333;
  transition: width 0.2s;
}

#prank {
  display: none;
}

#prank h2 {
  color: #50ff70;
  font-size: 30px;
}
</style>
</head>

<body>

<div class="box">

  <div id="loading">

    <div style="font-size:50px;">⚠️</div>

    <h1>تحذير أمني</h1>

    <p id="message">جارٍ فرمتة الجوال...</p>

    <div class="progress">
      <div id="bar"></div>
    </div>

    <p id="percent">0%</p>

    <small>لا تغلق الصفحة 😈</small>

  </div>

  <div id="prank">

    <div style="font-size:60px;">😂</div>

    <h2>انضحك عليك!</h2>

    <p>مجرد مزحة 🤣</p>

    <p>جوالك بخير ولم يحدث أي شيء.</p>

  </div>

</div>

<script>

let progress = 0;

let timer = setInterval(function() {

  progress += Math.floor(Math.random() * 7) + 3;

  if (progress > 100) {
    progress = 100;
  }

  document.getElementById("bar").style.width =
    progress + "%";

  document.getElementById("percent").textContent =
    progress + "%";

  if (progress < 40) {

    document.getElementById("message").textContent =
      "جارٍ فرمتة الجوال...";

  } else if (progress < 70) {

    document.getElementById("message").textContent =
      "جارٍ حذف الملفات...";

  } else if (progress < 99) {

    document.getElementById("message").textContent =
      "جارٍ فرمتة الجوال... 😱";

  } else {

    document.getElementById("message").textContent =
      "99%... لا تغلق الصفحة!";

  }

  if (progress >= 100) {

    clearInterval(timer);

    setTimeout(function() {

      document.getElementById("loading").style.display =
        "none";

      document.getElementById("prank").style.display =
        "block";

    }, 1000);

  }

}, 250);

</script>

</body>
  </html>
